<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FOXE://TERMINAL — Hybrid Financial Intelligence & Global Market Monitor</title>
<meta name="description" content="Bloomberg-style ASCII Hybrid Financial Terminal. Integrasi data Foxe Studio Keuangan & Global Market Radar."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   FOXE://TERMINAL — Bloomberg / ASCII High-Density Visual System
   ========================================================================== */
:root {
  --bg: #000000;
  --bg2: #050505;
  --surface: #080808;
  --surface2: #0d0d0d;
  --surface3: #141414;
  --ink: #dcdcdc;
  --ink-dim: #8e8e8e;
  --ink-faint: #555555;
  --line: #222222;
  --line2: #333333;
  --line-focus: #F28C00;
  --org: #F28C00;
  --org-ink: #000000;
  --org-dim: #8f580b;
  --org-glow: rgba(242, 140, 0, 0.25);
  --up: #00C176;
  --up-bg: rgba(0, 193, 118, 0.12);
  --dn: #FF4D4F;
  --dn-bg: rgba(255, 77, 79, 0.12);
  --flat: #8A8A8A;
  --cyan: #3FA7A3;
  --amber: #FFB454;
  --purple: #B288FF;
  --mono: "JetBrains Mono", "SF Mono", "Menlo", "Consolas", monospace;
  --cmdh: 36px;
  --tapeh: 32px;
  --clih: 28px;
  --row-h: 30px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--mono); font-size: 11px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--org); color: #000; }
button, input, select { font: inherit; color: inherit; background: none; border: none; outline: none; }
button { cursor: pointer; user-select: none; }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; color: var(--org); }

.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.up { color: var(--up); }
.dn { color: var(--dn); }
.flat { color: var(--flat); }
.org { color: var(--org); }
.cy { color: var(--cyan); }
.dim { color: var(--ink-dim); }
.faint { color: var(--ink-faint); }
.bold { font-weight: 700; }
.bolder { font-weight: 800; }

/* ---------- TOP COMMAND BAR ---------- */
#cmdbar {
  height: var(--cmdh);
  display: flex; align-items: stretch;
  background: var(--org); color: #000;
  border-bottom: 1px solid #000;
  font-size: 11px; font-weight: 700;
  user-select: none; z-index: 100;
}
#cmdbar .brand {
  padding: 0 12px; display: flex; align-items: center; gap: 6px;
  background: #000; color: var(--org); letter-spacing: 0.8px; font-weight: 800;
  border-right: 1px solid rgba(242, 140, 0, 0.4);
}
#cmdbar .brand .cursor {
  display: inline-block; width: 7px; height: 13px;
  background: var(--org); margin-left: 2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

#cmdbar .seg {
  display: flex; align-items: center; padding: 0 10px;
  border-left: 1px solid rgba(0,0,0,0.28);
}
#cmdbar .seg.grow { flex: 1; min-width: 0; overflow: hidden; }

.mode-group {
  display: flex; align-items: center; background: rgba(0,0,0,0.18);
  border: 1px solid rgba(0,0,0,0.5); border-radius: 2px; margin: 0 6px;
}
.mode-btn {
  padding: 2px 9px; font-size: 10px; font-weight: 800;
  color: #111; background: transparent; transition: all 0.15s;
}
.mode-btn:hover { background: rgba(0,0,0,0.2); }
.mode-btn.active {
  background: #000; color: var(--org);
}

.chip-status {
  padding: 1px 6px; font-size: 9px; font-weight: 800;
  background: #004d2c; color: #00C176; border: 1px solid #00C176;
}
.chip-status.offline {
  background: #4d0000; color: #FF4D4F; border-color: #FF4D4F;
}

.clock-seg {
  display: flex; align-items: center; gap: 10px; font-size: 10px; font-weight: 700;
}
.clock-seg span b { font-weight: 800; color: #000; }

.cmd-btn {
  padding: 0 10px; height: 100%; font-weight: 800; font-size: 11px;
  color: #000; border-left: 1px solid rgba(0,0,0,0.28);
  display: flex; align-items: center; gap: 4px;
}
.cmd-btn:hover { background: #000; color: var(--org); }
.cmd-btn.active { background: #000; color: var(--org); }

/* ---------- MARQUEE TICKER TAPE ---------- */
#tapebar {
  height: var(--tapeh);
  background: var(--bg2); border-bottom: 1px solid var(--line2);
  display: flex; align-items: stretch; overflow: hidden; position: relative;
  user-select: none;
}
#tapebar .tape-ctl {
  display: flex; align-items: center; gap: 6px; padding: 0 8px;
  background: #0a0a0a; border-right: 1px solid var(--line2);
  color: var(--org); font-weight: 800; font-size: 10px; z-index: 2;
}
#tapebar .tape-ctl button {
  color: var(--org); width: 20px; height: 20px;
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
}
#tapebar .tape-ctl button:hover { background: var(--org); color: #000; }

#tape-viewport { flex: 1; overflow: hidden; position: relative; min-width: 0; }
#tape-track {
  display: flex; position: absolute; top: 0; left: 0; height: 100%;
  align-items: center; will-change: transform;
}
.tape-item {
  display: flex; align-items: center; gap: 7px; padding: 0 12px;
  border-right: 1px solid var(--line); height: 100%; white-space: nowrap;
  font-size: 11px; cursor: pointer; transition: background 0.1s;
}
.tape-item:hover { background: rgba(242, 140, 0, 0.12); }
.tape-item .t-sym { color: var(--org); font-weight: 800; }
.tape-item .t-val { font-weight: 700; }
.tape-item .t-chg { font-size: 10px; }
.tape-flash-up { animation: flashUp 0.6s ease-out; }
.tape-flash-dn { animation: flashDn 0.6s ease-out; }
@keyframes flashUp { 0% { background: rgba(0, 193, 118, 0.4); } 100% { background: transparent; } }
@keyframes flashDn { 0% { background: rgba(255, 77, 79, 0.4); } 100% { background: transparent; } }

/* ---------- CANVAS & GRID SYSTEM ---------- */
#canvas {
  position: absolute;
  top: calc(var(--cmdh) + var(--tapeh));
  left: 0; right: 0;
  bottom: var(--clih);
  overflow-y: auto; overflow-x: hidden;
  background:
    repeating-linear-gradient(0deg, transparent 0 29px, rgba(35, 35, 35, 0.3) 29px 30px),
    repeating-linear-gradient(90deg, transparent 0 calc(100%/12 - 1px), rgba(35, 35, 35, 0.15) calc(100%/12 - 1px) calc(100%/12)),
    var(--bg);
  padding: 6px;
}
#canvas.edit-mode {
  background:
    repeating-linear-gradient(0deg, transparent 0 29px, rgba(242, 140, 0, 0.15) 29px 30px),
    repeating-linear-gradient(90deg, transparent 0 calc(100%/12 - 1px), rgba(242, 140, 0, 0.08) calc(100%/12 - 1px) calc(100%/12)),
    var(--bg);
}

#grid {
  position: relative;
  width: 100%;
  min-height: calc(100vh - 120px);
}

/* WIDGET BOX */
.widget {
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--line2);
  border-radius: 2px;
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: box-shadow 0.15s, border-color 0.15s;
  z-index: 10;
}
.widget.focused {
  border-color: var(--org) !important;
  box-shadow: 0 0 12px var(--org-glow);
  z-index: 25;
}
.widget.dragging {
  opacity: 0.85; z-index: 80 !important;
  border-color: var(--org) !important;
}
.widget.minimized .w-body { display: none; }
.widget.pinned .w-title { background: #161108; }

.w-title {
  flex: 0 0 24px;
  display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px;
  background: #0A0A0A; border-bottom: 1px solid var(--line2);
  font-size: 10px; font-weight: 800; letter-spacing: 0.5px; color: var(--org);
  user-select: none; touch-action: none;
}
.w-drag {
  flex: 1; display: flex; align-items: center; gap: 6px;
  cursor: grab; overflow: hidden;
}
.w-drag:active { cursor: grabbing; }
.w-num {
  background: var(--org); color: #000; padding: 1px 4px;
  font-size: 9px; font-weight: 800; border-radius: 1px;
}
.w-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-meta { margin-left: auto; color: var(--ink-faint); font-weight: 400; font-size: 9px; }

.w-btn {
  color: var(--ink-dim); width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; border-radius: 1px;
}
.w-btn:hover { color: #000; background: var(--org); }
.w-btn.active { color: #000; background: var(--org); }

.w-body {
  flex: 1; overflow: auto; position: relative;
  scrollbar-width: thin; scrollbar-color: var(--line2) transparent;
  display: flex; flex-direction: column;
}
.w-body::-webkit-scrollbar { width: 6px; height: 6px; }
.w-body::-webkit-scrollbar-thumb { background: var(--line2); }

.w-resize {
  position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
  cursor: nwse-resize; z-index: 5; touch-action: none;
  background: linear-gradient(135deg, transparent 50%, var(--org-dim) 50%, var(--org-dim) 60%, transparent 60%, transparent 70%, var(--org-dim) 70%, var(--org-dim) 80%, transparent 80%);
}

/* WIDGET TOOLBAR & ELEMENTS */
.w-toolbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
  padding: 4px 8px; background: #070707; border-bottom: 1px solid var(--line);
  font-size: 10px; flex-wrap: wrap;
}
.w-toolbar .tb-btn {
  padding: 2px 6px; border: 1px solid var(--line2);
  color: var(--ink-dim); font-size: 9px; font-weight: 700;
}
.w-toolbar .tb-btn:hover { border-color: var(--org); color: var(--ink); }
.w-toolbar .tb-btn.active { background: var(--org); color: #000; border-color: var(--org); }
.w-toolbar input.search-input {
  background: #000; border: 1px solid var(--line2); color: var(--ink);
  padding: 2px 6px; font-size: 10px; width: 110px;
}
.w-toolbar input.search-input:focus { border-color: var(--org); }

/* TABULAR DATA TABLE */
.terminal-tbl {
  width: 100%; border-collapse: collapse; font-size: 10.5px;
}
.terminal-tbl th {
  position: sticky; top: 0; background: #0c0c0c;
  border-bottom: 1px solid var(--line2); color: var(--org);
  padding: 4px 6px; text-align: left; font-weight: 800; font-size: 9.5px;
  letter-spacing: 0.3px; white-space: nowrap; z-index: 2;
}
.terminal-tbl td {
  padding: 4px 6px; border-bottom: 1px solid #161616;
  white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
}
.terminal-tbl tr:hover td { background: #121212; cursor: pointer; }
.terminal-tbl tr.active td { background: #1a1505; border-left: 2px solid var(--org); }

/* BADGES & CHIPS */
.pill {
  display: inline-block; padding: 1px 5px; font-size: 9px; font-weight: 800;
  border-radius: 1px; text-transform: uppercase;
}
.pill-cash { background: rgba(0, 193, 118, 0.2); color: #00C176; border: 1px solid rgba(0, 193, 118, 0.4); }
.pill-tf { background: rgba(242, 140, 0, 0.2); color: #F28C00; border: 1px solid rgba(242, 140, 0, 0.4); }
.pill-cogs { background: rgba(255, 77, 79, 0.2); color: #FF4D4F; border: 1px solid rgba(255, 77, 79, 0.4); }
.pill-opex { background: rgba(63, 167, 163, 0.2); color: #3FA7A3; border: 1px solid rgba(63, 167, 163, 0.4); }

/* KPI CARDS & BARS */
.kpi-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 6px; padding: 8px;
}
.kpi-box {
  background: #0B0B0B; border: 1px solid var(--line); padding: 6px 8px;
}
.kpi-label { font-size: 9px; color: var(--ink-dim); font-weight: 700; margin-bottom: 2px; }
.kpi-val { font-size: 15px; font-weight: 800; color: var(--ink); }
.kpi-sub { font-size: 9px; margin-top: 2px; }

.ascii-bar-wrap {
  display: flex; align-items: center; gap: 6px; margin: 3px 0;
}
.ascii-bar-track {
  flex: 1; height: 7px; background: #181818; border: 1px solid var(--line);
  position: relative; overflow: hidden;
}
.ascii-bar-fill { height: 100%; }

/* SQUARIFIED TREEMAP STAGE */
.treemap-stage {
  position: relative; width: 100%; height: 100%; min-height: 180px; overflow: hidden;
}
.tm-group {
  position: absolute; border: 1px solid var(--line2); overflow: hidden;
  background: rgba(10, 10, 10, 0.6);
}
.tm-glabel {
  position: absolute; top: 2px; left: 4px; font-size: 8.5px; font-weight: 800;
  color: var(--org); pointer-events: none; z-index: 3;
}
.tm-tile {
  position: absolute; border: 1px solid rgba(0,0,0,0.6);
  cursor: pointer; overflow: hidden; padding: 3px; display: flex;
  flex-direction: column; justify-content: space-between; transition: filter 0.1s;
}
.tm-tile:hover { filter: brightness(1.25); z-index: 4; outline: 1px solid var(--org); }
.tm-tile .t-title { font-weight: 800; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; }
.tm-tile .t-sub { font-size: 8.5px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 2px #000; }
.tm-tile .t-val { font-weight: 700; font-size: 9px; color: #fff; }

/* CANDLESTICK / INTRADAY CHART CANVAS */
.chart-container {
  position: relative; width: 100%; height: 100%; min-height: 200px;
}
canvas.chart-cv {
  width: 100%; height: 100%; display: block;
}
.chart-tooltip {
  position: absolute; display: none; background: rgba(0,0,0,0.92);
  border: 1px solid var(--org); padding: 4px 8px; font-size: 9.5px;
  pointer-events: none; z-index: 20; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

/* WORLD SESSIONS CLOCK */
.session-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; border-bottom: 1px solid var(--line);
}
.session-item:last-child { border-bottom: none; }
.session-name { font-weight: 800; color: var(--ink); }
.session-status {
  padding: 1px 6px; font-size: 9px; font-weight: 800; border-radius: 1px;
}
.session-open { background: rgba(0, 193, 118, 0.2); color: var(--up); border: 1px solid var(--up); }
.session-closed { background: rgba(255, 77, 79, 0.15); color: var(--dn); border: 1px solid var(--dn); }

/* NEWS WIRE */
.news-item {
  padding: 6px 8px; border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px; cursor: pointer;
}
.news-item:hover { background: #101010; }
.news-head { display: flex; align-items: center; gap: 6px; font-size: 9px; }
.news-tag {
  padding: 0 4px; font-size: 8.5px; font-weight: 800;
  background: #1f1f1f; color: var(--org); border: 1px solid var(--line2);
}
.news-title { font-size: 10.5px; color: var(--ink); line-height: 1.35; }
.news-item.read .news-title { color: var(--ink-faint); }

/* ---------- INSPECTOR DRAWER ---------- */
#inspector {
  position: fixed; top: var(--cmdh); right: -420px; width: 420px;
  bottom: var(--clih); background: #060606; border-left: 1px solid var(--org);
  z-index: 150; display: flex; flex-direction: column;
  transition: right 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: -8px 0 24px rgba(0,0,0,0.8);
}
#inspector.open { right: 0; }
.ins-head {
  height: 32px; background: #0d0d0d; border-bottom: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px; font-size: 11px; font-weight: 800; color: var(--org);
}
.ins-body {
  flex: 1; overflow-y: auto; padding: 12px; font-size: 10.5px;
}
.ins-sec {
  margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.ins-sec-title {
  color: var(--org); font-weight: 800; font-size: 9.5px; margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.ins-row {
  display: flex; justify-content: space-between; padding: 3px 0;
}
.ins-row .k { color: var(--ink-dim); }
.ins-row .v { font-weight: 700; color: var(--ink); }

/* ---------- BOTTOM COMMAND LINE (CLI) ---------- */
#clibar {
  position: absolute; bottom: 0; left: 0; right: 0; height: var(--clih);
  background: #050505; border-top: 1px solid var(--line2);
  display: flex; align-items: center; padding: 0 10px; gap: 8px;
  font-size: 11px; z-index: 110;
}
#clibar .prompt { color: var(--org); font-weight: 800; }
#clibar input {
  flex: 1; background: none; border: none; color: #fff;
  font-family: var(--mono); font-size: 11px;
}
#clibar .cli-hint { font-size: 9.5px; color: var(--ink-faint); }

/* ---------- ADD WIDGET MODAL ---------- */
#addmodal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center; z-index: 200;
}
#addmodal.open { display: flex; }
.modal-box {
  width: 440px; background: #080808; border: 1px solid var(--org);
  box-shadow: 0 0 20px rgba(242, 140, 0, 0.3); padding: 14px;
}
.modal-title { font-weight: 800; color: var(--org); font-size: 12px; margin-bottom: 10px; }
.widget-list { max-height: 280px; overflow-y: auto; margin-bottom: 12px; }
.w-pick-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 10.5px;
}
.w-pick-item:hover { background: #111; }
</style>
</head>
<body>

<!-- TOP COMMAND BAR -->
<header id="cmdbar" role="banner">
  <div class="brand">
    <span>FOXE://TERMINAL</span>
    <span class="cursor"></span>
  </div>

  <div class="seg">
    <span class="dim" style="font-size:9.5px;margin-right:4px;">MODE:</span>
    <div class="mode-group" role="group" aria-label="Terminal Mode">
      <button class="mode-btn active" id="btn-mode-studio" onclick="setTerminalMode('studio')">FOXE BI</button>
      <button class="mode-btn" id="btn-mode-market" onclick="setTerminalMode('market')">MARKETS</button>
      <button class="mode-btn" id="btn-mode-combo" onclick="setTerminalMode('combo')">COMBO</button>
    </div>
  </div>

  <div class="seg">
    <span class="chip-status" id="data-status-chip">SYNCED</span>
  </div>

  <div class="seg grow">
    <div class="clock-seg">
      <span>WIB <b><span id="clk-wib">--:--:--</span></b></span>
      <span class="faint">|</span>
      <span>UTC <b><span id="clk-utc">--:--:--</span></b></span>
      <span class="faint">|</span>
      <span>ET <b><span id="clk-et">--:--:--</span></b></span>
    </div>
  </div>

  <button class="cmd-btn" id="btn-edit-grid" onclick="toggleEditMode()" title="Toggle edit mode [E]">
    <span>[E]</span> EDIT GRID
  </button>
  <button class="cmd-btn" onclick="openAddWidgetModal()" title="Add/restore widget [+]">
    <span>[+]</span> WIDGET
  </button>
  <button class="cmd-btn" onclick="resetLayoutPrompt()" title="Reset default layout [P]">
    <span>[P]</span> PRESET
  </button>
  <button class="cmd-btn" id="btn-sound" onclick="toggleSound()" title="Toggle Audio Feedback">
    <span>[🔊]</span> AUD
  </button>
  <a href="index.html" class="cmd-btn" style="background:#000;color:var(--org);border-left:1px solid #000;" title="Buka Dashboard Klasik">
    <span>[↗]</span> DASHBOARD
  </a>
</header>

<!-- MARQUEE TICKER TAPE -->
<div id="tapebar" role="marquee">
  <div class="tape-ctl">
    <span>TAPE</span>
    <button id="tape-toggle-btn" onclick="toggleTape()" title="Pause/Resume Ticker [T]">⏸</button>
  </div>
  <div id="tape-viewport">
    <div id="tape-track"></div>
  </div>
</div>

<!-- CANVAS & GRID -->
<main id="canvas">
  <div id="grid"></div>
</main>

<!-- INSPECTOR DRAWER -->
<aside id="inspector" aria-label="Terminal Data Inspector">
  <div class="ins-head">
    <span id="ins-title">> INSPECTOR</span>
    <button class="w-btn" onclick="closeInspector()" style="font-size:14px;">✕</button>
  </div>
  <div class="ins-body" id="ins-content">
    <div class="faint" style="padding:20px;text-align:center;">
      > Pilih baris transaksi, aset, atau ticker untuk inspeksi detail.
    </div>
  </div>
</aside>

<!-- ADD WIDGET MODAL -->
<div id="addmodal" onclick="if(event.target===this)closeAddWidgetModal()">
  <div class="modal-box">
    <div class="modal-title">> ADD WIDGET TO CANVAS</div>
    <div class="widget-list" id="modal-widget-list"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="tb-btn" onclick="closeAddWidgetModal()">CLOSE</button>
    </div>
  </div>
</div>

<!-- BOTTOM COMMAND LINE INTERFACE (CLI) -->
<footer id="clibar">
  <span class="prompt">FOXE:CMD></span>
  <input type="text" id="cli-input" placeholder="Type command (e.g. :mode market, :focus btc, :help, :sound)" autocomplete="off" spellcheck="false"/>
  <span class="cli-hint">Press [?] for shortcuts · [Esc] close drawers</span>
</footer>

  // --- SQUARIFIED TREEMAP ALGORITHM (Bruls, Huizing, van Wijk) ---
  function squarify(items, rect) {
    if (!items.length) return [];
    const total = items.reduce((s, it) => s + it.value, 0);
    if (total <= 0) return [];
    
    function layout(nodes, r) {
      if (!nodes.length) return [];
      if (nodes.length === 1) {
        return [{ ...nodes[0], x: r.x, y: r.y, w: r.w, h: r.h }];
      }
      const sum = nodes.reduce((s, it) => s + it.value, 0);
      const isWide = r.w >= r.h;
      let row = [nodes[0]];
      let bestAspect = Infinity;
      let i = 1;

      for (; i < nodes.length; i++) {
        const candidate = nodes.slice(0, i + 1);
        const rowSum = candidate.reduce((s, it) => s + it.value, 0);
        const rowLength = isWide ? (rowSum / sum) * r.w : (rowSum / sum) * r.h;
        
        let maxA = 0;
        candidate.forEach(c => {
          const itemBreadth = (c.value / rowSum) * (isWide ? r.h : r.w);
          const a = Math.max(rowLength / itemBreadth, itemBreadth / rowLength);
          if (a > maxA) maxA = a;
        });

        if (maxA <= bestAspect) {
          bestAspect = maxA;
          row = candidate;
        } else {
          break;
        }
      }

      // Finalize row layout
      const rowSum = row.reduce((s, it) => s + it.value, 0);
      const rowLen = isWide ? (rowSum / sum) * r.w : (rowSum / sum) * r.h;
      const rects = [];
      let offset = 0;

      row.forEach(node => {
        const breadth = (node.value / rowSum) * (isWide ? r.h : r.w);
        if (isWide) {
          rects.push({ ...node, x: r.x, y: r.y + offset, w: rowLen, h: breadth });
        } else {
          rects.push({ ...node, x: r.x + offset, y: r.y, w: breadth, h: rowLen });
        }
        offset += breadth;
      });

      const remainingNodes = nodes.slice(row.length);
      const remainingRect = isWide
        ? { x: r.x + rowLen, y: r.y, w: r.w - rowLen, h: r.h }
        : { x: r.x, y: r.y + rowLen, w: r.w, h: r.h - rowLen };

      return rects.concat(layout(remainingNodes, remainingRect));
    }

    return layout(items, rect);
  }

            <span class="faint" style="margin-left:auto;font-size:9px;">LIVE WIRE</span>
          </div>
          <div style="overflow-y:auto;flex:1;" id="news-container">${html}</div>
        `;
      }
    }
  };

  // --- RENDERING ORDER ROWS ---
  window.renderOrderRows = function(orders) {
    const tbody = document.getElementById("tbl-orders-body");
    if (!tbody) return;
    tbody.innerHTML = orders.map(o => {
      const isCash = (o.cash || 0) > 0;
      return `
        <tr onclick="openInspector('order', ${JSON.stringify(o).replace(/"/g, '&quot;')})">
          <td class="faint">${(o.tanggal || '').slice(5)}</td>
          <td class="bold">${o.client || '-'}</td>
          <td>${o.paket || '-'}</td>
          <td><span class="pill ${isCash ? 'pill-cash' : 'pill-tf'}">${isCash ? 'CASH' : 'TF'}</span></td>
          <td class="num bold">${fmtRp(o.total)}</td>
          <td class="faint">${o.admin || '-'}</td>
        </tr>
      `;
    }).join("");
  };

  window.filterOrdersTable = function(q) {
    const query = (q || '').toLowerCase();
    const orders = window.F_TERMINAL.state.orders || [];
    const filtered = orders.filter(o => 
      (o.client || '').toLowerCase().includes(query) ||
      (o.paket || '').toLowerCase().includes(query) ||
      (o.admin || '').toLowerCase().includes(query)
    );
    renderOrderRows(filtered.slice(-100).reverse());
  };

  window.setOrderFilter = function(mode) {
    const orders = window.F_TERMINAL.state.orders || [];
    let filtered = orders;
    if (mode === 'CASH') filtered = orders.filter(o => (o.cash || 0) > 0);
    else if (mode === 'TF') filtered = orders.filter(o => (o.transfer || 0) > 0);
    renderOrderRows(filtered.slice(-100).reverse());
  };

  // --- DRAW SQUARIFIED COST TREEMAP ---
  function drawCostTreemap(expenses) {
    const stage = document.getElementById("cost-treemap");
    if (!stage) return;
    stage.innerHTML = "";
    const w = stage.clientWidth || 360;
    const h = stage.clientHeight || 200;

    // Group expenses by category
    const groups = {};
    expenses.forEach(e => {
      const cat = e.kategori || 'Lain-lain';
      groups[cat] = (groups[cat] || 0) + (e.nilai || 0);
    });

    const items = Object.entries(groups)
      .map(([k, v]) => ({ key: k, value: v }))
      .sort((a, b) => b.value - a.value);

    const tiles = squarify(items, { x: 0, y: 0, w: w, h: h });
    tiles.forEach(t => {
      const el = document.createElement("div");
      el.className = "tm-tile";
      el.style.left = `${t.x}px`;
      el.style.top = `${t.y}px`;
      el.style.width = `${Math.max(0, t.w - 1)}px`;
      el.style.height = `${Math.max(0, t.h - 1)}px`;
      el.style.background = t.key.includes('Produksi') || t.key.includes('Cetak') ? 'rgba(255, 77, 79, 0.45)' : 'rgba(63, 167, 163, 0.45)';
      el.innerHTML = `
        <div class="t-title">${t.key}</div>
        <div class="t-val">${fmtRp(t.value)}</div>
      `;
      el.onclick = () => {
        playTone(700, 'sine', 0.05);
        openInspector('expense_cat', { kategori: t.key, total: t.value });
      };
      stage.appendChild(el);
    });
  }

  // --- DRAW MARKET TREEMAP ---
  function drawMarketTreemap() {
    const stage = document.getElementById("market-treemap");
    if (!stage) return;
    stage.innerHTML = "";
    const w = stage.clientWidth || 360;
    const h = stage.clientHeight || 200;

    const sectors = window.F_TERMINAL.marketData.sectors;
    const items = sectors.map(s => ({ key: s.name, value: s.weight, payload: s }));
    const tiles = squarify(items, { x: 0, y: 0, w: w, h: h });

    tiles.forEach(t => {
      const s = t.payload;
      const el = document.createElement("div");
      el.className = "tm-tile";
      el.style.left = `${t.x}px`;
      el.style.top = `${t.y}px`;
      el.style.width = `${Math.max(0, t.w - 1)}px`;
      el.style.height = `${Math.max(0, t.h - 1)}px`;
      const isUp = s.chg >= 0;
      el.style.background = isUp ? 'rgba(0, 193, 118, 0.35)' : 'rgba(255, 77, 79, 0.35)';
      el.innerHTML = `
        <div class="t-title">${s.name}</div>
        <div class="t-sub">${s.stocks.join(", ")}</div>
        <div class="t-val ${isUp ? 'up' : 'dn'}">${fmtPct(s.chg)}</div>
      `;
      el.onclick = () => {
        playTone(750, 'sine', 0.05);
        openInspector('sector', s);
      };
      stage.appendChild(el);
    });
  }

  // --- DRAW CANDLESTICK INTRADAY CHART ---
  let chartType = 'candle';
  window.setChartType = function(type) {
    chartType = type;
    drawCandleChart();
  };

  function drawCandleChart() {
    const cv = document.getElementById("cv-intraday");
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const container = cv.parentElement;
    const w = container.clientWidth || 400;
    const h = container.clientHeight || 220;
    cv.width = w * window.devicePixelRatio;
    cv.height = h * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

    // Generate mock 30-bar intraday series for IHSG
    const bars = [];
    let cur = 7780;
    for (let i = 0; i < 30; i++) {
      const open = cur;
      const delta = (Math.random() - 0.46) * 12;
      const close = open + delta;
      const high = Math.max(open, close) + Math.random() * 8;
      const low = Math.min(open, close) - Math.random() * 8;
      const vol = Math.floor(Math.random() * 400 + 100);
      bars.push({ open, close, high, low, vol });
      cur = close;
    }

    const minPrice = Math.min(...bars.map(b => b.low)) - 4;
    const maxPrice = Math.max(...bars.map(b => b.high)) + 4;
    const range = maxPrice - minPrice || 1;

    const padLeft = 10, padRight = 50, padTop = 15, padBottom = 25;
    const plotW = w - padLeft - padRight;
    const plotH = h - padTop - padBottom;
    const barW = plotW / bars.length;

    // Clear
    ctx.fillStyle = "#080808";
    ctx.fillRect(0, 0, w, h);

    // Grid lines
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const y = padTop + (plotH / 3) * i;
      ctx.beginPath();
      ctx.moveTo(padLeft, y);
      ctx.lineTo(w - padRight, y);
      ctx.stroke();

      const priceLabel = (maxPrice - (range / 3) * i).toFixed(1);
      ctx.fillStyle = "#555555";
      ctx.font = "9px monospace";
      ctx.fillText(priceLabel, w - padRight + 6, y + 3);
    }

    // Render bars / lines
    if (chartType === 'line') {
      ctx.beginPath();
      ctx.strokeStyle = "#00C176";
      ctx.lineWidth = 2;
      bars.forEach((b, i) => {
        const x = padLeft + i * barW + barW / 2;
        const y = padTop + plotH - ((b.close - minPrice) / range) * plotH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    } else {
      bars.forEach((b, i) => {
        const isUp = b.close >= b.open;
        const x = padLeft + i * barW + barW / 2;
        const yOpen = padTop + plotH - ((b.open - minPrice) / range) * plotH;
        const yClose = padTop + plotH - ((b.close - minPrice) / range) * plotH;
        const yHigh = padTop + plotH - ((b.high - minPrice) / range) * plotH;
        const yLow = padTop + plotH - ((b.low - minPrice) / range) * plotH;

        ctx.strokeStyle = isUp ? "#00C176" : "#FF4D4F";
        ctx.fillStyle = isUp ? "#00C176" : "#FF4D4F";
        ctx.lineWidth = 1;

        // Wick
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // Body
        const bw = Math.max(3, barW * 0.7);
        const top = Math.min(yOpen, yClose);
        const bodyH = Math.max(2, Math.abs(yClose - yOpen));
        ctx.fillRect(x - bw / 2, top, bw, bodyH);
      });
    }

    // Crosshair event handling
    cv.onmousemove = function(e) {
      const rect = cv.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const idx = Math.floor((mouseX - padLeft) / barW);
      if (idx >= 0 && idx < bars.length) {
        const b = bars[idx];
        const tip = document.getElementById("cv-tooltip");
        if (tip) {
          tip.style.display = "block";
          tip.style.left = `${Math.min(w - 140, mouseX + 10)}px`;
          tip.style.top = `20px`;
          tip.innerHTML = `
            O: <b class="num">${b.open.toFixed(1)}</b> H: <b class="num">${b.high.toFixed(1)}</b><br>
            L: <b class="num">${b.low.toFixed(1)}</b> C: <b class="num ${b.close>=b.open?'up':'dn'}">${b.close.toFixed(1)}</b>
          `;
        }
      }
    };
    cv.onmouseleave = function() {
      const tip = document.getElementById("cv-tooltip");
      if (tip) tip.style.display = "none";
    };
  }

  // --- GRID & LAYOUT MANAGER ---
  function getActiveLayout() {
    const saved = localStorage.getItem(`foxe_layout_${window.F_TERMINAL.mode}`);
    if (saved) {
      try { return JSON.parse(saved); } catch(e) {}
    }
    return window.F_TERMINAL.layouts[window.F_TERMINAL.mode];
  }

  function saveActiveLayout(layout) {
    localStorage.setItem(`foxe_layout_${window.F_TERMINAL.mode}`, JSON.stringify(layout));
  }

  function renderActiveWidgets() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const layout = getActiveLayout();
    const colWidth = (grid.clientWidth || window.innerWidth) / 12;
    const rowHeight = 32;

    layout.forEach(item => {
      const def = WIDGET_DEFS[item.id];
      if (!def) return;

      const wEl = document.createElement("div");
      wEl.className = "widget";
      wEl.id = `widget-${item.id}`;
      wEl.style.left = `${item.x * colWidth}px`;
      wEl.style.top = `${item.y * rowHeight}px`;
      wEl.style.width = `${item.w * colWidth - 6}px`;
      wEl.style.height = `${item.h * rowHeight - 6}px`;

      wEl.innerHTML = `
        <div class="w-title">
          <div class="w-drag" title="Drag to reorder">
            <span class="w-num">${def.num}</span>
            <span class="w-name">${def.title}</span>
          </div>
          <button class="w-btn" onclick="toggleMinimizeWidget('${item.id}')" title="Minimize">_</button>
          <button class="w-btn" onclick="closeWidget('${item.id}')" title="Close">✕</button>
        </div>
        <div class="w-body" id="body-${item.id}"></div>
        <div class="w-resize" title="Resize widget"></div>
      `;

      // Setup drag and drop
      setupWidgetDrag(wEl, item, colWidth, rowHeight);
      setupWidgetResize(wEl, item, colWidth, rowHeight);

      grid.appendChild(wEl);
      def.render(wEl.querySelector(".w-body"));
    });
  }

  function setupWidgetDrag(wEl, item, colW, rowH) {
    const handle = wEl.querySelector(".w-drag");
    let startX, startY, origX, origY;

    handle.onmousedown = function(e) {
      if (!window.F_TERMINAL.editMode) return;
      e.preventDefault();
      playTone(480, 'sine', 0.04);
      wEl.classList.add("dragging");
      startX = e.clientX;
      startY = e.clientY;
      origX = parseFloat(wEl.style.left);
      origY = parseFloat(wEl.style.top);

      document.onmousemove = function(ev) {
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        wEl.style.left = `${origX + dx}px`;
        wEl.style.top = `${origY + dy}px`;
      };

      document.onmouseup = function() {
        document.onmousemove = null;
        document.onmouseup = null;
        wEl.classList.remove("dragging");
        
        // Snap to grid
        const newCol = Math.max(0, Math.min(11, Math.round(parseFloat(wEl.style.left) / colW)));
        const newRow = Math.max(0, Math.round(parseFloat(wEl.style.top) / rowH));
        item.x = newCol;
        item.y = newRow;
        wEl.style.left = `${newCol * colW}px`;
        wEl.style.top = `${newRow * rowH}px`;
        
        const layout = getActiveLayout();
        const found = layout.find(l => l.id === item.id);
        if (found) { found.x = newCol; found.y = newRow; }
        saveActiveLayout(layout);
        playTone(600, 'sine', 0.04);
      };
    };
  }

  function setupWidgetResize(wEl, item, colW, rowH) {
    const handle = wEl.querySelector(".w-resize");
    let startX, startY, origW, origH;

    handle.onmousedown = function(e) {
      if (!window.F_TERMINAL.editMode) return;
      e.preventDefault();
      wEl.classList.add("focused");
      startX = e.clientX;
      startY = e.clientY;
      origW = parseFloat(wEl.style.width);
      origH = parseFloat(wEl.style.height);

      document.onmousemove = function(ev) {
        const dw = ev.clientX - startX;
        const dh = ev.clientY - startY;
        wEl.style.width = `${Math.max(120, origW + dw)}px`;
        wEl.style.height = `${Math.max(80, origH + dh)}px`;
      };

      document.onmouseup = function() {
        document.onmousemove = null;
        document.onmouseup = null;
        wEl.classList.remove("focused");

        // Snap size to grid
        const cols = Math.max(2, Math.min(12, Math.round(parseFloat(wEl.style.width) / colW)));
        const rows = Math.max(3, Math.round(parseFloat(wEl.style.height) / rowH));
        item.w = cols;
        item.h = rows;
        wEl.style.width = `${cols * colW - 6}px`;
        wEl.style.height = `${rows * rowH - 6}px`;

        const layout = getActiveLayout();
        const found = layout.find(l => l.id === item.id);
        if (found) { found.w = cols; found.h = rows; }
        saveActiveLayout(layout);
        
        // Re-draw canvas / charts
        if (item.id === 'chart') drawCandleChart();
        if (item.id === 'neraca') drawCostTreemap(window.F_TERMINAL.state.expenses || []);
        if (item.id === 'heatmap') drawMarketTreemap();
      };
    };
  }

  window.toggleMinimizeWidget = function(id) {
    const wEl = document.getElementById(`widget-${id}`);
    if (wEl) wEl.classList.toggle("minimized");
  };

  window.closeWidget = function(id) {
    let layout = getActiveLayout();
    layout = layout.filter(l => l.id !== id);
    saveActiveLayout(layout);
    renderActiveWidgets();
  };

  // --- MODE SWITCHER ---
  window.setTerminalMode = function(mode) {
    window.F_TERMINAL.mode = mode;
    ['studio', 'market', 'combo'].forEach(m => {
      const btn = document.getElementById(`btn-mode-${m}`);
      if (btn) btn.classList.toggle('active', m === mode);
    });
    playTone(620, 'triangle', 0.06);
    renderTape();
    renderActiveWidgets();
  };

  window.toggleEditMode = function() {
    window.F_TERMINAL.editMode = !window.F_TERMINAL.editMode;
    const btn = document.getElementById("btn-edit-grid");
    btn.classList.toggle("active", window.F_TERMINAL.editMode);
    document.getElementById("canvas").classList.toggle("edit-mode", window.F_TERMINAL.editMode);
    playTone(window.F_TERMINAL.editMode ? 720 : 420, 'sine', 0.05);
  };

  window.resetLayoutPrompt = function() {
    if (confirm(`Reset layout default untuk mode ${window.F_TERMINAL.mode.toUpperCase()}?`)) {
      localStorage.removeItem(`foxe_layout_${window.F_TERMINAL.mode}`);
      renderActiveWidgets();
      playTone(800, 'sine', 0.06);
    }
  };

  // --- INSPECTOR CONTROLLER ---
  window.openInspector = function(type, data) {
    const ins = document.getElementById("inspector");
    const body = document.getElementById("ins-content");
    const title = document.getElementById("ins-title");
    title.textContent = `> INSPECTOR · ${type.toUpperCase()}`;
    
    let html = "";
    if (type === 'order') {
      html = `
        <div class="ins-sec">
          <div class="ins-sec-title">TRANSACTION AUDIT</div>
          <div class="ins-row"><span class="k">Client Name</span><span class="v org">${data.client || '-'}</span></div>
          <div class="ins-row"><span class="k">Paket Foto</span><span class="v">${data.paket || '-'}</span></div>
          <div class="ins-row"><span class="k">Tanggal Booking</span><span class="v">${data.tanggal || '-'}</span></div>
          <div class="ins-row"><span class="k">Jadwal Foto</span><span class="v">${data.tanggalFoto || '-'}</span></div>
          <div class="ins-row"><span class="k">Admin Attribution</span><span class="v cy">${data.admin || '-'}</span></div>
        </div>
        <div class="ins-sec">
          <div class="ins-sec-title">PAYMENT SPLIT</div>
          <div class="ins-row"><span class="k">Cash Amount</span><span class="v num up">${fmtRp(data.cash)}</span></div>
          <div class="ins-row"><span class="k">Transfer Amount</span><span class="v num cy">${fmtRp(data.transfer)}</span></div>
          <div class="ins-row"><span class="k">Total Settlement</span><span class="v num bold org">${fmtRp(data.total)}</span></div>
        </div>
      `;
    } else if (type === 'ticker') {
      html = `
        <div class="ins-sec">
          <div class="ins-sec-title">INSTRUMENT TELEMETRY</div>
          <div class="ins-row"><span class="k">Symbol</span><span class="v org bold">${data.sym}</span></div>
          <div class="ins-row"><span class="k">Description</span><span class="v">${data.name}</span></div>
          <div class="ins-row"><span class="k">Last Price</span><span class="v num bold ${data.chgPct>=0?'up':'dn'}">${fmtNum(data.last)}</span></div>
          <div class="ins-row"><span class="k">Net Change</span><span class="v num ${data.chgPct>=0?'up':'dn'}">${fmtPct(data.chgPct)}</span></div>
          <div class="ins-row"><span class="k">Intraday Range</span><span class="v num faint">${data.low} - ${data.high}</span></div>
          <div class="ins-row"><span class="k">24h Volume</span><span class="v">${data.vol}</span></div>
        </div>
      `;
    } else {
      html = `<div class="ins-sec"><pre style="font-size:9.5px;color:#aaa;white-space:pre-wrap;">${JSON.stringify(data, null, 2)}</pre></div>`;
    }
    
    body.innerHTML = html;
    ins.classList.add("open");
  };

  window.closeInspector = function() {
    document.getElementById("inspector").classList.remove("open");
  };

  // --- ADD WIDGET MODAL ---
  window.openAddWidgetModal = function() {
    const list = document.getElementById("modal-widget-list");
    const layout = getActiveLayout();
    const activeIds = layout.map(l => l.id);
    
    list.innerHTML = Object.entries(WIDGET_DEFS).map(([id, def]) => {
      const active = activeIds.includes(id);
      return `
        <div class="w-pick-item">
          <div><b class="org">${def.num}</b> ${def.title} <span class="faint">(${def.category})</span></div>
          <button class="tb-btn ${active ? 'active' : ''}" onclick="toggleAddWidget('${id}')">${active ? 'ADDED' : '+ ADD'}</button>
        </div>
      `;
    }).join("");

    document.getElementById("addmodal").classList.add("open");
  };

  window.closeAddWidgetModal = function() {
    document.getElementById("addmodal").classList.remove("open");
  };

  window.toggleAddWidget = function(id) {
    let layout = getActiveLayout();
    const exists = layout.find(l => l.id === id);
    if (exists) {
      layout = layout.filter(l => l.id !== id);
    } else {
      layout.push({ id, x: 0, y: 15, w: 6, h: 6 });
    }
    saveActiveLayout(layout);
    openAddWidgetModal();
    renderActiveWidgets();
  };

  // --- CLI COMMAND HANDLER ---
  const cliInput = document.getElementById("cli-input");
  cliInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      const cmd = this.value.trim().toLowerCase();
      this.value = "";
      handleCliCommand(cmd);
    }
  });

  function handleCliCommand(cmd) {
    playTone(550, 'sine', 0.05);
    if (cmd === ':help') {
      alert("FOXE://TERMINAL Commands:\n:mode studio - Switch to Foxe BI\n:mode market - Switch to Markets\n:mode combo - Switch to Combo Mode\n:edit - Toggle Grid Edit\n:preset - Reset Layout\n:sound - Toggle Audio\n:tape - Toggle Ticker Tape");
    } else if (cmd.startsWith(':mode ')) {
      const m = cmd.replace(':mode ', '').trim();
      if (['studio', 'market', 'combo'].includes(m)) setTerminalMode(m);
    } else if (cmd === ':edit') {
      toggleEditMode();
    } else if (cmd === ':preset') {
      resetLayoutPrompt();
    } else if (cmd === ':sound') {
      toggleSound();
    } else if (cmd === ':tape') {
      toggleTape();
    } else if (cmd.startsWith(':focus ')) {
      const sym = cmd.replace(':focus ', '').trim().toUpperCase();
      const ticker = window.F_TERMINAL.marketData.tickers.find(t => t.sym === sym);
      if (ticker) openInspector('ticker', ticker);
    }
  }

  // --- GLOBAL KEYBOARD SHORTCUTS ---
  document.addEventListener("keydown", function(e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "Escape") {
      closeInspector();
      closeAddWidgetModal();
    } else if (e.key === "e" || e.key === "E") {
      toggleEditMode();
    } else if (e.key === "t" || e.key === "T") {
      toggleTape();
    } else if (e.key === "m" || e.key === "M") {
      const modes = ['studio', 'market', 'combo'];
      const nextIdx = (modes.indexOf(window.F_TERMINAL.mode) + 1) % modes.length;
      setTerminalMode(modes[nextIdx]);
    } else if (e.key === "?") {
      handleCliCommand(':help');
    }
  });

  // --- WINDOW RESIZE ---
  window.addEventListener("resize", () => {
    renderActiveWidgets();
  });

  // --- BOOT ---
  loadStateData();
})();
</script>
</body>

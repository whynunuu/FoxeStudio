name: Foxe Studio Follow-Up Reminder (10:00, 14:00, 20:00 WIB)

on:
  schedule:
    # Berjalan di jam 10:00, 14:00, 20:00 WIB (WIB = UTC+7):
    # 03:00 UTC = 10:00 WIB (Pagi)
    # 07:00 UTC = 14:00 WIB (Siang)
    # 13:00 UTC = 20:00 WIB (Malam)
    - cron: '0 3,7,13 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Follow-Up Reminder Script
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: |
          python trigger_leads_reminder.py

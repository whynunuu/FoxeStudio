name: Foxe Studio - Cloud Auto-Sync & Telegram Broadcast

on:
  schedule:
    # 02:00 UTC = 09:00 WIB (Studio Buka / Pagi)
    - cron: '0 2 * * *'
    # 14:00 UTC = 21:00 WIB (Studio Closing / Rekap Malam)
    - cron: '0 14 * * *'
  push:
    branches:
      - main
    paths:
      - 'deep_sync_foxe.py'
      - 'parser_*.py'
      - 'assemble_app.py'
      - 'telegram_notifier.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch: # Tombol "Run workflow" manual dari web GitHub / HP

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'foxe-sync'
  cancel-in-progress: false

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Sinkronisasi Google Drive & Notifikasi Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python deep_sync_foxe.py

      - name: Commit dan Simpan Data ke Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add foxe_full_state.json index.html file1.xlsm file2.xlsx file_neraca.xlsx
          git diff --staged --quiet || (git commit -m "Auto-sync Google Drive (Cloud Cron) [skip ci]" && git push)

      - name: Setup GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Artifact Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy ke GitHub Pages (Online Live Web)
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

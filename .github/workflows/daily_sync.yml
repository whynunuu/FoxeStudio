name: Foxe Studio - Daily 09:00 AM Sync

on:
  schedule:
    # 02:00 UTC = 09:00 WIB (UTC+7) - Eksekusi setiap hari jam 9 pagi WIB
    - cron: '0 2 * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual dari web GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Sinkronisasi Google Drive
        run: |
          python deep_sync_foxe.py

      - name: Commit dan Simpan Hasil ke Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add foxe_full_state.json index.html file1.xlsm file2.xlsx file3_export.xlsx
          git diff --staged --quiet || (git commit -m "Auto-sync Google Drive (09:00 WIB) [skip ci]" && git push)

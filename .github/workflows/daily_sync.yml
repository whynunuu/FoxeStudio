name: Foxe Studio - Cloud Auto-Sync & Telegram Broadcast

on:
  schedule:
    # Auto-Sync Cloud Setiap 3 Jam di Jam Operasional Studio (09:00, 12:00, 15:00, 18:00, 21:00 WIB)
    # Konversi UTC: 02:00, 05:00, 08:00, 11:00, 14:00 UTC (WIB = UTC + 7)
    - cron: '0 2,5,8,11,14 * * *'
  workflow_dispatch: # Tombol "Run workflow" manual dari web GitHub / HP

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'foxe-sync'
  cancel-in-progress: false

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Sinkronisasi Google Drive & Notifikasi Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python deep_sync_foxe.py

      - name: Commit dan Simpan Data ke Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add foxe_full_state.json index.html file1.xlsm file1_okt.xlsm file2.xlsx file_neraca.xlsx file2_okt.xlsx file_wisuda_3okt.xlsx file_wisuda_4okt.xlsx
          git diff --staged --quiet || (git commit -m "Auto-sync Google Drive (Cloud Cron) [skip ci]" && git push)

      - name: Setup GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Artifact Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy ke GitHub Pages (Online Live Web)
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
